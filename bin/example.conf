[agent]
  host = "pippo.wp.lan"

# Send tornado messages to NATS
[nats]
  ## URLs of NATS servers
  server = "nats://10.62.7.31:4222"

  ## NATS subject for producer messages
  subject = "tornado_nats_json.icinga2_events_forwarder"

  ## Use Transport Layer Security
  secure = true
  # tls_ca = "/etc/telegraf/ca.pem"
  tls_cert = "certs/tornado_nats_json_user.crt.pem"
  tls_key = "certs/private/tornado_nats_json_user.key.pem"
  ## Use TLS but skip chain & host verification
  insecure_skip_verify = true

[events_stream]
  ##
  url_request = "https://localhost:5665/v1/events?queue=more&types=CheckResult"
  insecure_skip_verify = true

  ##
  username = "root"
  password = "974a00c8931bbaac"
  ##password = "e19c4c3f56afe0c8"

[icinga]
  connection = "@tcp(127.0.0.1:3306)/icinga"
  username = "icinga"
  password = "Z6UWKXIuKBM7ssxvW5XV8M52McTSkJ"
  refresh_interval = "5m"
  [icinga.queries]
    read_groups_query = "SELECT h.name AS host,GROUP_CONCAT(DISTINCT g.name ORDER BY g.name ASC) AS groups FROM hostgroup_member m JOIN hostgroup g ON g.environment_id=m.environment_id AND g.id=m.hostgroup_id JOIN host h on h.environment_id=m.environment_id AND h.id=m.host_id GROUP BY h.name"

[director]
  connection = "@tcp(127.0.0.1:3306)/director?parseTime=true"
  username = "director"
  password = "bGILrIuThsaano6fo0qMUbZuTnhA6t"
  refresh_interval = "5m"
  [director.queries]
    deleted_hosts_query = "select object_name,convert_tz(change_time,@@session.time_zone,'+00:00') as change_time_utc from director_activity_log where action_name = 'delete' and object_type = 'icinga_host' and convert_tz(change_time,@@session.time_zone,'+00:00') > '%s'"
    changed_hosts_query = "select object_name,convert_tz(change_time,@@session.time_zone,'+00:00') as change_time_utc,old_properties,new_properties from director_activity_log where action_name = 'modify' and object_type = 'icinga_host' and convert_tz(change_time,@@session.time_zone,'+00:00') > '@%s'"
    deleted_services_query = "select object_name,convert_tz(change_time,@@session.time_zone,'+00:00') as change_time_utc,old_properties from director_activity_log where action_name = 'delete' and object_type = 'icinga_service' and convert_tz(change_time,@@session.time_zone,'+00:00') > '%s'"
    changed_services_query = "select object_name,convert_tz(change_time,@@session.time_zone,'+00:00') as change_time_utc,old_properties,new_properties from director_activity_log where action_name = 'modify' and object_type = 'icinga_service' and convert_tz(change_time,@@session.time_zone,'+00:00') > '%s'"
